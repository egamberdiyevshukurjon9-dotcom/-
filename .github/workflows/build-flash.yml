name: Build flash package

on:
  push:
    paths:
      - "voice-presentation/**"
      - ".github/workflows/build-flash.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Тайёр пакетни GitHub Release'га жойлаш (стандарт: фақат сиз кўрадиган қoralама - draft)"
        type: boolean
        default: false
      publish:
        description: "Release'ни ҳамма учун очиқ эълон қилиш (стандарт: йўқ, draft қолади)"
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s voice-presentation/tests -v

  build-windows:
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PKG: voice-presentation\dist\VoicePresentation-Flash
      PY: voice-presentation\dist\VoicePresentation-Flash\VoiceApp\runtime\python.exe
      VOICE_NOPAUSE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the flash package (Python + libraries + Vosk models)
        run: python voice-presentation/tools/build_flash.py --no-zip

      - name: Bundle contents
        shell: pwsh
        run: |
          Get-Content "$env:PKG\VoiceApp\VERSION.txt"
          Get-ChildItem "$env:PKG\VoiceApp\models" | ForEach-Object { "{0}: {1:N0} MB" -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) }

      - name: Unit tests with the bundled Python
        run: '%PY% -X utf8 -B -m unittest discover -s voice-presentation\tests -v'
        shell: cmd

      - name: Smoke test - imports, COM, DLLs
        run: '%PY% -X utf8 -B voice-presentation\tools\ci_smoke.py'
        shell: cmd

      - name: Vosk models - which command words each model knows
        continue-on-error: true
        shell: cmd
        run: |
          %PY% -X utf8 -B %PKG%\VoiceApp\app\presentation_voice.py --selftest --verbose
          echo ===== candidate words per model =====
          %PY% -X utf8 -B %PKG%\VoiceApp\app\presentation_voice.py --word-check @voice-presentation\tools\ci_candidates.txt

      - name: Offline recognition with real English speech (Windows TTS -> Vosk)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          "Voices: " + (($synth.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }) -join ", ")
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $cases = @(
            @{ file = "next";   text = "next slide";                              expect = "next";   calib = "next_1" },
            @{ file = "next2";  text = "next";                                    expect = "next";   calib = "next_2" },
            @{ file = "prev";   text = "previous slide";                          expect = "prev";   calib = "prev_1" },
            @{ file = "black";  text = "black screen";                            expect = "black";  calib = "black_1" },
            @{ file = "goto";   text = "go to slide five";                        expect = "goto:5"; calib = "goto5_1" },
            @{ file = "exit";   text = "exit";                                    expect = "exit";   calib = "exit_1" },
            @{ file = "n1";     text = "the weather is nice today";               expect = "none" },
            @{ file = "n2";     text = "let us look at the next example";         expect = "none" },
            @{ file = "n3";     text = "he went to the next room and closed the door"; expect = "none" },
            @{ file = "n4";     text = "this slide shows the results of the experiment"; expect = "none" }
          )
          $failed = 0
          $calibDir = Join-Path $env:RUNNER_TEMP "calib"
          New-Item -ItemType Directory -Force $calibDir | Out-Null
          $py = $env:PY
          $script = "$env:PKG\VoiceApp\app\presentation_voice.py"
          foreach ($case in $cases) {
            $wav = Join-Path $env:RUNNER_TEMP ("{0}.wav" -f $case.file)
            $synth.SetOutputToWaveFile($wav, $format)
            $synth.Speak($case.text)
            $synth.SetOutputToNull()
            if ($case.calib) { Copy-Item $wav (Join-Path $calibDir ("{0}.wav" -f $case.calib)) }
            Write-Host "--- '$($case.text)' -> expect $($case.expect)   [grammar mode]"
            & $py -X utf8 -B $script --wav $wav --expect $case.expect
            if ($LASTEXITCODE -ne 0) { $failed++ }
            Write-Host "    (for comparison) free mode:"
            & $py -X utf8 -B $script --wav $wav --expect $case.expect --free
          }
          $synth.Dispose()
          if ($failed -gt 0) { Write-Host "::error::$failed ta nutq sinovi (grammar rejimi) muvaffaqiyatsiz"; exit 1 }

      - name: Google path (SpeechRecognition + flac + network) with real English speech
        continue-on-error: true
        shell: cmd
        run: |
          %PY% -X utf8 -B %PKG%\VoiceApp\app\presentation_voice.py --wav %RUNNER_TEMP%\next.wav --expect next --engine google --lang en-US
          %PY% -X utf8 -B %PKG%\VoiceApp\app\presentation_voice.py --wav %RUNNER_TEMP%\goto.wav --expect goto:5 --engine google --lang en-US

      - name: Calibration on speech files (accuracy report; fails below 80%)
        shell: cmd
        run: '%PY% -X utf8 -B %PKG%\VoiceApp\app\presentation_voice.py --calibrate-wav %RUNNER_TEMP%\calib --min-accuracy 0.8'

      - name: START.bat chain (batch file -> embedded Python -> arguments)
        shell: cmd
        run: |
          %PKG%\START.bat --list-mics
          %PKG%\START.bat --wav %RUNNER_TEMP%\next.wav --expect next

      - name: Run from a folder with spaces and Cyrillic letters (flash on any PC)
        continue-on-error: true
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "Тест папка Иванов"
          Copy-Item -Recurse $env:PKG $dest
          $wav = Join-Path $env:RUNNER_TEMP "next.wav"
          & (Join-Path $dest "VoiceApp\runtime\python.exe") -X utf8 -B (Join-Path $dest "VoiceApp\app\presentation_voice.py") --wav $wav --expect next
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Autostart installer (INSTALL -> works from installed copy -> UNINSTALL)
        shell: pwsh
        run: |
          $startup = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup"
          $launcher = Join-Path $startup "VoicePresentationWatcher.bat"
          $target = Join-Path $env:ProgramData "VoicePresentation"
          New-Item -ItemType Directory -Force $startup | Out-Null
          cmd /c "$env:PKG\INSTALL_AUTOSTART.bat"
          if ($LASTEXITCODE -ne 0) { throw "INSTALL_AUTOSTART.bat exit code $LASTEXITCODE" }
          Start-Sleep -Seconds 6
          if (-not (Test-Path "$target\runtime\python.exe")) { throw "runtime was not copied" }
          if (-not (Test-Path "$target\models\uz\am\final.mdl")) { throw "models were not copied" }
          if (-not (Test-Path $launcher)) { throw "startup launcher was not created" }
          "--- launcher:"; Get-Content $launcher
          $watchers = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*presentation_voice.py*--watch*" }
          "watcher processes: $(@($watchers).Count)"
          if (@($watchers).Count -lt 1) { throw "watcher is not running" }
          & "$target\runtime\python.exe" -X utf8 -B "$target\app\presentation_voice.py" --wav "$env:RUNNER_TEMP\next.wav" --expect next
          if ($LASTEXITCODE -ne 0) { throw "recognition from the installed copy failed" }
          $watchers | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 2
          cmd /c "$env:PKG\UNINSTALL_AUTOSTART.bat"
          if ($LASTEXITCODE -ne 0) { throw "UNINSTALL_AUTOSTART.bat exit code $LASTEXITCODE" }
          if ((Test-Path $target) -or (Test-Path $launcher)) { throw "uninstall left files behind" }

      - name: Build the single-file self-extracting installer (7-Zip SFX)
        id: sfx
        continue-on-error: true
        shell: pwsh
        run: |
          $seven = "C:\Program Files\7-Zip"
          if (-not (Test-Path "$seven\7z.sfx")) { Get-ChildItem $seven | Out-Host; throw "7z.sfx module not found" }
          $dist = (Resolve-Path "voice-presentation\dist").Path
          $archive = Join-Path $dist "package.7z"
          Remove-Item $archive -ErrorAction SilentlyContinue
          Push-Location $env:PKG
          & "$seven\7z.exe" a -t7z -m0=lzma2 -mx=5 -mmt=on $archive ".\*" | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "7z a failed: $LASTEXITCODE" }
          Pop-Location
          $out = Join-Path $dist "VoicePresentation-Setup.exe"
          $output = [System.IO.File]::Create($out)
          foreach ($part in @("$seven\7z.sfx", (Resolve-Path "voice-presentation\tools\sfx_config.txt").Path, $archive)) {
            $input = [System.IO.File]::OpenRead($part); $input.CopyTo($output); $input.Dispose()
          }
          $output.Dispose()
          Remove-Item $archive
          "{0:N0} MB: {1}" -f ((Get-Item $out).Length / 1MB), $out
          & "$seven\7z.exe" t $out | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "SFX integrity check failed" }
          # ҳақиқий ишга тушириш: жимжит чиқариш (GUI сўрамасдан)
          $test = Join-Path $env:RUNNER_TEMP "sfx_test"
          $process = Start-Process -FilePath $out -ArgumentList @("-y", "-gm2", "-o`"$test`"") -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw "SFX did not finish in 300 s" }
          "SFX exit code: $($process.ExitCode)"
          foreach ($needed in @("START.bat", "PULT.bat", "VoiceApp\runtime\python.exe", "VoiceApp\models\uz\am\final.mdl", "VoiceApp\app\presentation_voice.py")) {
            if (-not (Test-Path (Join-Path $test $needed))) { throw "not extracted: $needed" }
          }
          & (Join-Path $test "VoiceApp\runtime\python.exe") -X utf8 -B (Join-Path $test "VoiceApp\app\presentation_voice.py") --wav (Join-Path $env:RUNNER_TEMP "next.wav") --expect next
          if ($LASTEXITCODE -ne 0) { throw "recognition from the SFX-extracted copy failed" }

      - name: Upload the single-file installer
        if: steps.sfx.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VoicePresentation-Setup-exe
          path: voice-presentation/dist/VoicePresentation-Setup.exe
          compression-level: 0
          retention-days: 30

      - name: Upload the flash package (the downloaded zip is extracted straight onto the flash drive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoicePresentation-Flash
          path: voice-presentation/dist/VoicePresentation-Flash
          retention-days: 30
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoicePresentation-Flash
          path: VoicePresentation-Flash
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: VoicePresentation-Setup-exe
          path: setup
      - name: Create the release (draft unless "publish" is ticked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r -q VoicePresentation-Flash.zip VoicePresentation-Flash
          files="VoicePresentation-Flash.zip"
          if [ -f setup/VoicePresentation-Setup.exe ]; then files="setup/VoicePresentation-Setup.exe $files"; fi
          draft="--draft"
          if [ "${{ inputs.publish }}" = "true" ]; then draft=""; fi
          gh release create "flash-${{ github.run_number }}" $files $draft \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --title "Flash package #${{ github.run_number }}" \
            --notes "VoicePresentation-Setup.exe (bitta fayl): fleshkaga nusxalang va ikki marta bosing. Zip: ochib, ichidagi hamma narsani fleshkaga nusxalang. START.bat - ishga tushirish."
